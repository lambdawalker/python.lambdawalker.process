[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[project]
name = "lambdawalker-process"
version = "0.1.0"
description = "Parallel process management utilities for LambdaWalker"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "LambdaWalker", email = "lambdawalker@isdavid.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "tqdm>=4.67.1"
]

[project.urls]
Homepage = "https://github.com/lambdawalker/python.lambdawalker.process"
Repository = "https://github.com/lambdawalker/python.lambdawalker.process"
Issues = "https://github.com/lambdawalker/python.lambdawalker.process/issues"

[tool.uv.build-backend]
module-name = "lambdawalker.process"
namespace = true
